name: devdockerqt6
services:
  # Pre run setup container (uses builder stage with full Qt6 build deps)
  init-setup:
    image: ${QTCREATOR_IMAGE_NAME:-zanyxdev/qt6-19-21-36-27.2.12479018}-builder
    profiles: ["build"]
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 12G
        reservations:
          memory: 2G
    # memswap_limit задается на корневом уровне сервиса
    memswap_limit: 16g
    user: "root:root"
    build:
      dockerfile: ./Dockerfile
      target: builder
      args:
        QT_VERSION: ${QT_VERSION}
        LANG: "ru-RU.UTF-8"
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        TZ: "Europe/Moscow"
    environment:
      - QT_VERSION=${QT_VERSION}
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
      - LANG=ru-RU.UTF-8
      - QTCREATOR_URL=${QTCREATOR_URL}
      - CCACHE_DIR=/ccache
      - CCACHE_TEMPDIR=/ccache/tmp
      - CCACHE_DIRECT=true
      - CCACHE_INODECACHE=true
      - CCACHE_COMPILERCHECK=content
      - CCACHE_UMASK=002
      - BUILD_JOBS=2
    volumes:
      - ${PWD}/init.sh:/root/init.sh
      - src-volume:/usr/local/src
      - opt-volume:/opt
      - ccache-volume:/ccache      
    entrypoint: []
    command: >
      sh -c "chmod +x /root/init.sh && /root/init.sh &&
      chown -R ${USER_ID}:${GROUP_ID} /ccache /opt /usr/local/src"
    restart: "no"

  # Main dev container (uses lightweight runtime stage)
  qtcreator:
    image: ${QTCREATOR_IMAGE_NAME:-zanyxdev/qt6-19-21-36-27.2.12479018}
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
      - CAP_SYS_PTRACE
    network_mode: "host"
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 6G
        reservations:
          cpus: '2.0'
          memory: 3G
    group_add:
      - ${GROUP_ID}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build:
      dockerfile: ./Dockerfile
      target: runtime
      args:
        QT_VERSION: ${QT_VERSION}
        LANG: "ru-RU.UTF-8"
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        TZ: "Europe/Moscow"
    container_name: qtcreator-6.12-dev
    environment:
      - TERM=xterm-256color
      - QT_ANDROID_DEBUGGER_MAIN_THREAD_SLEEP_MS=10000
      - ANDROID_ADB_SERVER_ADDRESS=127.0.0.1
      - ADB_SERVER_SOCKET=tcp:127.0.0.1:5037
      - ANDROID_ADB_SERVER_PORT=5037
      - CCACHE_DIR=/ccache
      - CCACHE_TEMPDIR=/ccache/tmp
      - DISPLAY=:0
      - XDG_RUNTIME_DIR=/tmp/runtime-developer
      - PULSE_SERVER=unix:/tmp/runtime-developer/pulse/native
      - PULSE_COOKIE=/tmp/pulseaudio.cookie
      - QT_MEDIA_BACKEND=ffmpeg
      - AUDIO_DRIVERS=pulse
      - CCACHE_UMASK=002
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
    volumes:
      - ${XDG_RUNTIME_DIR}/pulse/native:/tmp/runtime-developer/pulse/native
      - ~/.config/pulse/cookie:/tmp/pulseaudio.cookie
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - $XAUTH:/home/developer/.Xauthority
      - ccache-volume:/ccache
      - src-volume:/usr/local/src
      - opt-volume:/opt
      - ${HOMEAPP}:/home/developer
    stdin_open: true
    tty: true
    init: true
    command: bash

volumes:
  src-volume:
    name: ${SRC_VOLUME_NAME}
  opt-volume:
    name: ${OPT_VOLUME_NAME}
  ccache-volume:
    name: ${CCACHE_VOLUME}
